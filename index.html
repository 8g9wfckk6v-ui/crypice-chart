<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f6">
<title>Crypice Live</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://s3.tradingview.com/tv.js"></script>
<style>
  :root {
    --bg:#f4f5f6; --panel:#eceef0; --card:#ffffff; --line:#d5d9dd;
    --ink:#111111; --muted:#6b7178;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --cond: "Arial Narrow", "Roboto Condensed", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; background:var(--bg); color:var(--ink);
    font-family:var(--cond); overflow:hidden; }
  .app { display:flex; flex-direction:column; height:100%; padding-bottom:env(safe-area-inset-bottom, 0px); }

  /* шапка */
  .head { display:flex; align-items:center; justify-content:space-between;
    padding:11px 14px 9px; background:var(--panel); flex:0 0 auto; }
  .logo { display:flex; align-items:center; gap:8px; font-weight:700; letter-spacing:3px; font-size:16px; text-transform:uppercase; }
  .mark { width:9px; height:9px; background:var(--ink); transform:rotate(45deg); }
  .src { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--muted);
    letter-spacing:1px; text-transform:uppercase; }
  .dot { width:6px; height:6px; border-radius:50%; background:var(--ink); animation:pulse 1.8s infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.2; } }

  /* монети */
  .coins { display:flex; gap:6px; padding:0 10px 8px; background:var(--panel);
    overflow-x:auto; scrollbar-width:none; flex:0 0 auto; }
  .coins::-webkit-scrollbar, .tfs::-webkit-scrollbar { display:none; }
  .chip { flex:1 0 66px; background:var(--card); border:1px solid var(--line); border-radius:6px;
    padding:7px 6px; text-align:center; cursor:pointer; transition:background .15s, color .15s, transform .1s; }
  .chip:active { transform:scale(.96); }
  .chip .k { font-size:13px; font-weight:700; letter-spacing:1px; }
  .chip .p { font-family:var(--mono); font-size:11px; margin-top:2px; }
  .chip .c { font-family:var(--mono); font-size:10px; margin-top:1px; color:var(--muted); }
  .chip .c.up { color:var(--ink); font-weight:700; }
  .chip .c.down { color:var(--muted); }
  .chip.active { background:var(--ink); border-color:var(--ink); color:#fff; }
  .chip.active .c, .chip.active .c.up { color:#fff; }
  .chip.active .c.down { color:#aeb4ba; }

  /* таймфрейми */
  .tfs { display:flex; gap:4px; padding:0 10px 8px; background:var(--panel);
    border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:none; flex:0 0 auto; }
  .tf { flex:1; background:transparent; color:var(--muted); border:1px solid transparent; border-radius:5px;
    padding:6px 0; font-family:var(--mono); font-size:12px; font-weight:700; cursor:pointer; }
  .tf.active { background:var(--ink); color:#fff; }

  /* графік + заставка */
  .chart { position:relative; flex:1 1 auto; min-height:0; }
  #tv { position:absolute; inset:0; }
  .splash { position:absolute; inset:0; background:var(--bg); display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; z-index:5; transition:opacity .35s; }
  .splash.hide { opacity:0; pointer-events:none; }
  .splash .big { font-weight:700; letter-spacing:6px; font-size:22px; }
  .splash .sub { font-family:var(--mono); font-size:10px; color:var(--muted); letter-spacing:1px; }
  .splash .bar { width:120px; height:2px; background:var(--line); overflow:hidden; }
  .splash .bar::after { content:""; display:block; width:40%; height:100%; background:var(--ink);
    animation:slide 1s infinite ease-in-out; }
  @keyframes slide { 0% { transform:translateX(-100%); } 100% { transform:translateX(300%); } }
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <div class="logo"><span class="mark"></span>Crypice</div>
    <div class="src"><span class="dot"></span>[ Live · Binance ]</div>
  </div>
  <div class="coins" id="coins"></div>
  <div class="tfs" id="tfs"></div>
  <div class="chart">
    <div id="tv"></div>
    <div class="splash" id="splash">
      <div class="big">CRYPICE</div>
      <div class="bar"></div>
      <div class="sub">[ CORE DATA SYNC: LOADING ]</div>
    </div>
  </div>
</div>

<script>
  const tg = window.Telegram && window.Telegram.WebApp;
  function haptic() { try { tg.HapticFeedback.selectionChanged(); } catch (e) {} }
  if (tg) {
    try { tg.ready(); } catch (e) {}
    try { tg.expand(); } catch (e) {}
    try { tg.disableVerticalSwipes(); } catch (e) {}   // щоб свайп по графіку не закривав вікно
    try { tg.setHeaderColor("#eceef0"); tg.setBackgroundColor("#f4f5f6"); } catch (e) {}
    try { tg.setBottomBarColor("#f4f5f6"); } catch (e) {}
  }

  const COINS = [
    { k:"BTC", s:"BTCUSDT" }, { k:"ETH", s:"ETHUSDT" }, { k:"SOL", s:"SOLUSDT" },
    { k:"XRP", s:"XRPUSDT" }, { k:"BNB", s:"BNBUSDT" }
  ];
  const TFS = [ ["15m","15"], ["1H","60"], ["4H","240"], ["1D","D"] ];

  function load(key, fallback) { try { return localStorage.getItem(key) || fallback; } catch (e) { return fallback; } }
  function save(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }

  let coin = load("cx_coin", "BTC");
  let tf = load("cx_tf", "60");
  if (!COINS.find(c => c.k === coin)) coin = "BTC";
  if (!TFS.find(t => t[1] === tf)) tf = "60";

  // монета з посилання: t.me/бот/chart?startapp=ETH (має пріоритет)
  const sp = tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param;
  if (sp && COINS.find(c => c.k === sp.toUpperCase())) coin = sp.toUpperCase();

  function fmtPrice(p) {
    if (p == null || isNaN(p)) return "···";
    if (p >= 1000) return p.toLocaleString("en-US", { maximumFractionDigits: 0 });
    if (p >= 1) return p.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return p.toFixed(4);
  }

  function renderChips() {
    const el = document.getElementById("coins");
    el.innerHTML = COINS.map(c => {
      const has = typeof c.chg === "number";
      const cls = !has ? "" : (c.chg >= 0 ? "up" : "down");
      const txt = !has ? "···" : (c.chg >= 0 ? "▲ +" : "▼ ") + c.chg.toFixed(2) + "%";
      return `<div class="chip ${c.k === coin ? "active" : ""}" data-k="${c.k}">
        <div class="k">${c.k}</div>
        <div class="p">${fmtPrice(c.price)}</div>
        <div class="c ${cls}">${txt}</div>
      </div>`;
    }).join("");
  }

  function renderTfs() {
    const el = document.getElementById("tfs");
    el.innerHTML = TFS.map(t =>
      `<button class="tf ${t[1] === tf ? "active" : ""}" data-v="${t[1]}">${t[0]}</button>`
    ).join("");
  }

  document.getElementById("coins").addEventListener("click", e => {
    const chip = e.target.closest(".chip");
    if (!chip || chip.dataset.k === coin) return;
    coin = chip.dataset.k; save("cx_coin", coin); haptic();
    renderChips(); drawChart();
  });
  document.getElementById("tfs").addEventListener("click", e => {
    const b = e.target.closest(".tf");
    if (!b || b.dataset.v === tf) return;
    tf = b.dataset.v; save("cx_tf", tf); haptic();
    renderTfs(); drawChart();
  });

  async function loadTickers() {
    try {
      const syms = encodeURIComponent(JSON.stringify(COINS.map(c => c.s)));
      const r = await fetch("https://data-api.binance.vision/api/v3/ticker/24hr?symbols=" + syms);
      const d = await r.json();
      d.forEach(t => {
        const c = COINS.find(x => x.s === t.symbol);
        if (c) { c.price = parseFloat(t.lastPrice); c.chg = parseFloat(t.priceChangePercent); }
      });
      renderChips();
    } catch (e) { /* без цін чіпи просто показують ··· */ }
  }

  const splash = document.getElementById("splash");
  function hideSplash() { splash.classList.add("hide"); }

  function drawChart() {
    splash.classList.remove("hide");
    const box = document.getElementById("tv");
    box.innerHTML = "";
    new TradingView.widget({
      container_id: "tv",
      autosize: true,
      symbol: "BINANCE:" + coin + "USDT",
      interval: tf,
      timezone: "Europe/Kyiv",
      theme: "light",
      style: "1",
      locale: "uk",
      backgroundColor: "#f4f5f6",
      gridColor: "#e1e4e8",
      toolbar_bg: "#f4f5f6",
      enable_publishing: false,
      allow_symbol_change: false,
      hide_side_toolbar: false,
      save_image: false,
      overrides: {
        "paneProperties.background": "#f4f5f6",
        "paneProperties.backgroundType": "solid",
        "paneProperties.vertGridProperties.color": "#e1e4e8",
        "paneProperties.horzGridProperties.color": "#e1e4e8",
        "paneProperties.crossHairProperties.color": "#111111",
        "scalesProperties.textColor": "#2a2e33",
        "scalesProperties.lineColor": "#c9ced3",
        // свічки як на референсі: ріст = порожня з чорним контуром, падіння = чорна
        "mainSeriesProperties.candleStyle.upColor": "#ffffff",
        "mainSeriesProperties.candleStyle.downColor": "#111111",
        "mainSeriesProperties.candleStyle.borderUpColor": "#111111",
        "mainSeriesProperties.candleStyle.borderDownColor": "#111111",
        "mainSeriesProperties.candleStyle.wickUpColor": "#111111",
        "mainSeriesProperties.candleStyle.wickDownColor": "#111111"
      }
    });
    // ховаємо заставку, коли iframe графіка завантажився (страховка: максимум 3 с)
    let tries = 0;
    const iv = setInterval(() => {
      const f = box.querySelector("iframe");
      tries++;
      if (f) { clearInterval(iv); f.addEventListener("load", hideSplash); setTimeout(hideSplash, 3000); }
      else if (tries > 30) { clearInterval(iv); hideSplash(); }
    }, 100);
  }

  renderChips();
  renderTfs();
  drawChart();
  loadTickers();
  setInterval(loadTickers, 15000);
</script>
</body>
</html>
